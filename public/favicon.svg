    <circle cx="12" cy="44" r="3" fill="#f4e8c1" stroke-width="2"/>
    <circle cx="52" cy="44" r="3" fill="#f4e8c1" stroke-width="2"/>
    <circle cx="12" cy="58" r="3" fill="#f4e8c1" stroke-width="2"/>
